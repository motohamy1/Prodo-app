<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECE7FE"/>
      <stop offset="100%" stop-color="#9E8EF8"/>
    </linearGradient>

    <linearGradient id="limeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8BB825"/>
      <stop offset="60%" stop-color="#C5E04F"/>
      <stop offset="100%" stop-color="#EBF4A6"/>
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEFEF9"/>
      <stop offset="50%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F6E5C9"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Centered within Android Adaptive Safe Zone (66% scale) -->
  <g transform="translate(140, 150) scale(0.72)" filter="url(#shadow)">
    <!-- Left Vertical Stem -->
    <line x1="336" y1="296" x2="336" y2="728" 
          stroke="url(#lavenderGrad)" stroke-width="96" stroke-linecap="round"/>

    <!-- Dynamic Diagonal Bridge -->
    <line x1="336" y1="296" x2="688" y2="728" 
          stroke="url(#mintGrad)" stroke-width="96" stroke-linecap="round"/>

    <!-- Right Vertical Stem -->
    <line x1="688" y1="296" x2="688" y2="728" 
          stroke="url(#limeGrad)" stroke-width="96" stroke-linecap="round"/>

    <!-- Focal Nuqta / North Star -->
    <g transform="translate(688, 206)">
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#creamGrad)"/>
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
