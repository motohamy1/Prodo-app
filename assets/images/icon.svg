<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="check-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-opacity="0.25" flood-color="#000000" />
    </filter>
  </defs>
  
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg-gradient)" />
  
  <g filter="url(#shadow)">
    <!-- Stylized 'P' -->
    <path d="M 380 280 L 380 740" stroke="url(#icon-gradient)" stroke-width="85" stroke-linecap="round" fill="none" />
    <path d="M 380 340 C 650 340, 650 580, 380 580" stroke="url(#icon-gradient)" stroke-width="85" stroke-linecap="round" fill="none" />
    
    <!-- Elegant Checkmark -->
    <path d="M 520 620 L 620 720 L 800 450" stroke="url(#check-gradient)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
