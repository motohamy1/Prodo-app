<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1B1D2A"/>
      <stop offset="55%" stop-color="#101118"/>
      <stop offset="100%" stop-color="#08090C"/>
    </radialGradient>

    <!-- Gradients for Nizam Emblem -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECE7FE"/>
      <stop offset="100%" stop-color="#9E8EF8"/>
    </linearGradient>

    <linearGradient id="limeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8BB825"/>
      <stop offset="60%" stop-color="#C5E04F"/>
      <stop offset="100%" stop-color="#EBF4A6"/>
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEFEF9"/>
      <stop offset="50%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F6E5C9"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGlow)"/>
  <rect width="1020" height="1020" x="2" y="2" rx="222" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Geometric Grid Accent representing Order / System -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="2">
    <circle cx="512" cy="512" r="360" fill="none"/>
    <circle cx="512" cy="512" r="230" fill="none"/>
    <line x1="152" y1="512" x2="872" y2="512"/>
    <line x1="512" y1="152" x2="512" y2="872"/>
  </g>

  <!-- Core Nizam Emblem -->
  <g filter="url(#shadow)">
    <!-- Ambient Back Glow -->
    <path d="M 336 296 L 336 728 L 688 296 L 688 728" 
          stroke="#9E8EF8" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" 
          opacity="0.12" fill="none"/>

    <!-- Left Vertical Stem (Lavender: Origin & Vision) -->
    <line x1="336" y1="296" x2="336" y2="728" 
          stroke="url(#lavenderGrad)" stroke-width="96" stroke-linecap="round"/>

    <!-- Dynamic Diagonal Bridge (Ice Mint / Flow: Execution & Process) -->
    <line x1="336" y1="296" x2="688" y2="728" 
          stroke="url(#mintGrad)" stroke-width="96" stroke-linecap="round"/>

    <!-- Right Vertical Stem (Pastel Lime: Harmony & Completion) -->
    <line x1="688" y1="296" x2="688" y2="728" 
          stroke="url(#limeGrad)" stroke-width="96" stroke-linecap="round"/>

    <!-- Focal Nuqta / North Star (Warm Cream: Focus & Alignment) -->
    <g transform="translate(688, 206)">
      <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#creamGrad)" filter="url(#subtleGlow)"/>
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
